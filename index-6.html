function getUrlRoom() {
  const q = new URLSearchParams(window.location.search).get("room");
  if (q) return q.replace(/[^A-Za-z0-9-]/g, "").slice(0, 8);
  const m = window.location.pathname.match(/\/room\/([A-Za-z0-9-]+)/);

}

// Shows item.img (a photo URL) if set, otherwise the illustration
function Thumb({ item, size = 72 }) {
  if (item.img) {
    return (
      <img
        src={item.img}
        alt={item.name}
        width={size}
        height={size}
        className="rounded-xl shrink-0"
        style={{ objectFit: "cover", width: size, height: size }}
      />
    );
  }
  const art = ART[item.id];
  return (
    <svg
      viewBox="0 0 64 64"
      width={size}
      height={size}
      role="img"
      aria-label={item.name}
      className="rounded-xl shrink-0"
      style={{ display: "block" }}
    >
      <rect width="64" height="64" fill={art[0]} />
      {art[1]}
    </svg>
  );
}

const money = (n) => `$${n.toFixed(2)}`;

function KeyTag({ room }) {
  return (
    <div
      className="flex flex-col items-center px-4 pt-3 pb-2 rounded-b-3xl shadow-md"
      style={{ background: C.brass, color: "#fff", width: 84 }}
      aria-label={`Room ${room}`}
    >
      <div
        className="rounded-full mb-1"
        style={{ width: 14, height: 14, background: C.paper, boxShadow: "inset 0 1px 2px rgba(0,0,0,.35)" }}
      />
      <span className="text-xs" style={{ opacity: 0.85 }}>Room</span>
      <span className="text-3xl leading-none pb-1" style={display}>{room}</span>
    </div>
  );
}

          onChange={(e) => setRoom(e.target.value)}
          className="rounded px-1 py-0.5"
          style={{ background: "#173C47", color: "#fff", border: "1px solid #2B5560" }}
          aria-label="Choose room for demo"
        >
          {["101", "204", "315", "512"].map((r) => (
            <option key={r} value={r}>/room/{r}</option>
          ))}
        </select>
      </div>}
    </header>
  );
}

function Qty({ qty, onAdd, onRemove, name }) {
  if (!qty) {
    return (
      <button
        onClick={onAdd}
        className="flex items-center gap-1 rounded-full px-3 py-1.5 text-sm font-medium"
        style={{ background: C.seaSoft, color: C.sea }}
        aria-label={`Add ${name}`}
      >
        <Plus size={15} /> Add
      </button>
    );
  }
  return (
    <div className="flex items-center gap-2 rounded-full px-1 py-1" style={{ background: C.sea, color: "#fff" }}>
      <button onClick={onRemove} className="p-1 rounded-full" aria-label={`Remove one ${name}`}>
        <Minus size={15} />
      </button>
      <span className="w-4 text-center text-sm font-medium" aria-live="polite">{qty}</span>
      <button onClick={onAdd} className="p-1 rounded-full" aria-label={`Add one more ${name}`}>
        <Plus size={15} />
      </button>
    </div>
  );
}

function MenuView({ tab, setTab, cart, add, remove }) {
  return (
    <>
      <nav
        className="sticky top-0 z-10 flex gap-2 overflow-x-auto px-5 py-3"
        style={{ background: C.paper, borderBottom: `1px solid ${C.line}` }}
        aria-label="Categories"
      >
        {CATEGORIES.map((c) => {
          const active = c.id === tab;
          return (
            <button
              key={c.id}
              onClick={() => setTab(c.id)}
              className="whitespace-nowrap rounded-full px-4 py-2 text-sm font-medium"
              style={{
                background: active ? C.ink : "transparent",
                color: active ? "#fff" : C.ink,
                border: `1px solid ${active ? C.ink : C.line}`,
              }}
              aria-pressed={active}
            >
              {c.label}
            </button>
          );
        })}
      </nav>

      <ul className="px-5 pt-2 pb-28">
        {MENU[tab].map((item) => (
          <li
            key={item.id}
            className="flex items-center gap-4 py-4"
            style={{ borderBottom: `1px solid ${C.line}` }}
          >
            <Thumb item={item} size={72} />
            <div className="flex-1 min-w-0">
              <p className="font-medium" style={{ color: C.ink }}>{item.name}</p>
              <p className="text-sm" style={{ color: C.muted }}>{item.desc}</p>
              <p className="text-sm mt-1 font-medium" style={{ color: item.price ? C.ink : C.sea }}>
                {item.price ? money(item.price) : item.note}
              </p>
            </div>
            <Qty
              qty={cart[item.id] || 0}
              onAdd={() => add(item.id)}
              onRemove={() => remove(item.id)}
              name={item.name}
            />
          </li>
        ))}
      </ul>
    </>
  );
}

function CheckoutView({ lines, subtotal, service, total, room, onBack, onPlace, add, remove }) {
  const [when, setWhen] = useState("asap");
  const [time, setTime] = useState("19:30");
  const [pay, setPay] = useState("room");
  const [note, setNote] = useState("");

  const Option = ({ value, current, set, children }) => (
    <button
      onClick={() => set(value)}
      className="rounded-xl px-3 py-3 text-sm text-left flex-1"
      style={{
        background: current === value ? C.seaSoft : C.card,
        border: `1.5px solid ${current === value ? C.sea : C.line}`,
        color: C.ink,
      }}
      aria-pressed={current === value}
    >
      {children}
    </button>
  );

  const label = when === "asap" ? "As soon as possible" : when === "30" ? "In 30 minutes" : `At ${time}`;

  return (
    <div className="px-5 pt-4 pb-32">
      <button onClick={onBack} className="flex items-center gap-1 text-sm mb-4" style={{ color: C.sea }}>
        <ChevronLeft size={16} /> Back to menu
      </button>
      <h2 className="text-2xl mb-4" style={{ ...display, color: C.ink }}>Your order</h2>

      <ul className="rounded-2xl px-4" style={{ background: C.card, border: `1px solid ${C.line}` }}>
        {lines.map(({ item, qty }) => (
          <li key={item.id} className="flex items-center justify-between gap-3 py-3"
              style={{ borderBottom: `1px solid ${C.line}` }}>
            <Thumb item={item} size={44} />
            <div className="min-w-0 flex-1">
              <p className="text-sm font-medium" style={{ color: C.ink }}>{item.name}</p>
              <p className="text-xs" style={{ color: C.muted }}>
                {item.price ? money(item.price * qty) : item.note}
              </p>
            </div>
            <Qty qty={qty} onAdd={() => add(item.id)} onRemove={() => remove(item.id)} name={item.name} />
          </li>
        ))}
        <li className="py-3 text-sm space-y-1" style={{ color: C.muted }}>
          <div className="flex justify-between"><span>Subtotal</span><span>{money(subtotal)}</span></div>
          <div className="flex justify-between"><span>Service charge (10%)</span><span>{money(service)}</span></div>
          <div className="flex justify-between font-medium pt-1" style={{ color: C.ink }}>
            <span>Total</span><span>{money(total)}</span>
          </div>
        </li>
      </ul>

      <h3 className="text-sm font-medium mt-6 mb-2" style={{ color: C.ink }}>When do you want it?</h3>
      <div className="flex gap-2">
        <Option value="asap" current={when} set={setWhen}>As soon as possible</Option>
        <Option value="30" current={when} set={setWhen}>In 30 minutes</Option>
        <Option value="time" current={when} set={setWhen}>Pick a time</Option>
      </div>
      {when === "time" && (
        <input
          type="time"
          value={time}
          onChange={(e) => setTime(e.target.value)}
          className="mt-2 rounded-xl px-3 py-2 text-sm w-full"
          style={{ border: `1.5px solid ${C.line}`, background: C.card, color: C.ink }}
          aria-label="Delivery time"
        />
      )}

      <h3 className="text-sm font-medium mt-6 mb-2" style={{ color: C.ink }}>How do you want to pay?</h3>
      <div className="flex gap-2">
        <Option value="room" current={pay} set={setPay}>
          <span className="flex items-center gap-2"><KeyRound size={15} /> Charge to room {room}</span>
        </Option>
        <Option value="card" current={pay} set={setPay}>
          <span className="flex items-center gap-2"><CreditCard size={15} /> Pay by card</span>
        </Option>
      </div>
      {pay === "card" && (
        <p className="text-xs mt-2" style={{ color: C.muted }}>
          In the full version, a secure card form (Stripe) appears here.
        </p>
      )}

      <h3 className="text-sm font-medium mt-6 mb-2" style={{ color: C.ink }}>Notes for the team</h3>
      <textarea
        value={note}
        onChange={(e) => setNote(e.target.value)}
        rows={3}
        placeholder="Allergies, how you like it cooked, anything else"
        className="w-full rounded-xl px-3 py-2 text-sm"
        style={{ border: `1.5px solid ${C.line}`, background: C.card, color: C.ink }}
      />

      <div className="fixed bottom-0 left-0 right-0 flex justify-center" style={{ pointerEvents: "none" }}>
        <div className="w-full max-w-md p-4" style={{ background: C.paper, borderTop: `1px solid ${C.line}`, pointerEvents: "auto" }}>
          <button
            onClick={() => onPlace({ label, pay, note, total })}
            className="w-full rounded-full py-3.5 font-medium"
            style={{ background: C.ink, color: "#fff" }}
          >
            Place order · {money(total)}
          </button>
        </div>
      </div>
    </div>
  );
}

function TrackingView({ order, room, status, onNew }) {
  return (
    <div className="px-5 pt-8 pb-12">
      <div
        className="flex items-center justify-center rounded-full mb-4"
        style={{ width: 48, height: 48, background: C.sea, color: "#fff" }}
      >
        <Check size={26} />
      </div>
      <h2 className="text-2xl" style={{ ...display, color: C.ink }}>
        {status === 3 ? "Delivered to your room" : "Order placed"}
      </h2>
      <p className="text-sm mt-1" style={{ color: C.muted }}>
        Order #{order.id} for room {room}. {order.label}. {order.pay === "room" ? "Charged to your room." : "Paid by card."}
      </p>

      <ol className="mt-8" aria-label="Order progress">
        {STEPS.map((s, i) => {
          const done = i <= status;
          const current = i === status;
          return (
            <li key={s} className="flex gap-4">
              <div className="flex flex-col items-center">
                <div
                  className="flex items-center justify-center rounded-full"
                  style={{
                    width: 26, height: 26,
                    background: done ? C.sea : C.card,
                    border: `2px solid ${done ? C.sea : C.line}`,
                    color: "#fff",
                  }}
                >
                  {done && <Check size={14} />}
                </div>
                {i < STEPS.length - 1 && (
                  <div style={{ width: 2, height: 36, background: i < status ? C.sea : C.line }} />
                )}
              </div>
              <p
                className="pt-0.5"
                style={{ color: done ? C.ink : C.muted, fontWeight: current ? 600 : 400 }}
              >
                {s}
              </p>
            </li>
          );
        })}
      </ol>

      <p className="text-xs mt-4" style={{ color: C.muted }}>
        Demo only: statuses advance automatically. In the real app, staff update them from their dashboard.
      </p>

      <button
        onClick={onNew}
        className="mt-8 w-full rounded-full py-3.5 font-medium"
        style={{ border: `1.5px solid ${C.ink}`, color: C.ink }}
      >
        Order something else
      </button>
    </div>
  );
}

function HotelOrdering() {
  const urlRoom = getUrlRoom();
  const [room, setRoom] = useState(urlRoom || "204");
  const demo = !urlRoom;
  const [tab, setTab] = useState("room");
  const [cart, setCart] = useState({});
  const [view, setView] = useState("menu");
  const [order, setOrder] = useState(null);
  const [status, setStatus] = useState(0);

  const add = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const remove = (id) =>
    setCart((c) => {
      const next = { ...c };
      if (next[id] > 1) next[id] -= 1;
      else delete next[id];
      return next;
    });

  const lines = useMemo(
    () =>
      Object.entries(cart).map(([id, qty]) => ({
        item: ALL_ITEMS.find((i) => i.id === id),
        qty,
      })),
    [cart]
  );
  const count = lines.reduce((n, l) => n + l.qty, 0);
  const subtotal = lines.reduce((n, l) => n + l.item.price * l.qty, 0);
  const service = subtotal * SERVICE_RATE;
  const total = subtotal + service;

  useEffect(() => {
    if (view !== "tracking" || status >= 3) return;
    const t = setTimeout(() => setStatus((s) => s + 1), 3500);
    return () => clearTimeout(t);
  }, [view, status]);

  useEffect(() => {
    if (view === "checkout" && count === 0) setView("menu");
  }, [view, count]);

  const place = (details) => {
    setOrder({ id: 1000 + Math.floor(Math.random() * 900), ...details });
    setStatus(0);
    setCart({});
    setView("tracking");
  };

  const reset = () => {
    setOrder(null);
    setView("menu");
  };

  return (
    <div className="min-h-screen flex justify-center" style={{ background: "#DDE6E3" }}>
      <div className="w-full max-w-md relative min-h-screen" style={{ background: C.paper, color: C.ink }}>
        <Header room={room} setRoom={setRoom} demo={demo} />

        {view === "menu" && (
          <>
            <MenuView tab={tab} setTab={setTab} cart={cart} add={add} remove={remove} />
            {count > 0 && (
              <div className="fixed bottom-0 left-0 right-0 flex justify-center pointer-events-none">
                <div className="w-full max-w-md p-4 pointer-events-auto">
                  <button
                    onClick={() => setView("checkout")}
                    className="w-full flex items-center justify-between rounded-full px-5 py-3.5 shadow-lg"
                    style={{ background: C.ink, color: "#fff" }}
                  >
                    <span className="flex items-center gap-2 font-medium">
                      <ShoppingBag size={18} /> View order ({count})
                    </span>
                    <span className="font-medium">{money(subtotal)}</span>
                  </button>
                </div>
              </div>
            )}
          </>
        )}

        {view === "checkout" && (
          <CheckoutView
            lines={lines}
            subtotal={subtotal}
            service={service}
            total={total}
            room={room}
            onBack={() => setView("menu")}
            onPlace={place}
            add={add}
            remove={remove}
          />
        )}

        {view === "tracking" && order && (
          <TrackingView order={order} room={room} status={status} onNew={reset} />
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<HotelOrdering />);
</script>
</body>
</html>
